<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<!-- header -->
<header>
    <nav>
        <a href="/" id="logo">Delivery</a>
        <a href="/registrieren" id="registrieren">Registrieren</a>
        <a href="/einloggen" id="einloggen">Einloggen</a>
    </nav>
    <!-- errors -->
    <div id="toast_msg"></div>
</header>

<!-- authentication (login) -->
<section id="auth_part">
    <section id="auth_box">
        <h1 id="auth_title">Einloggen</h1>

        <form id="auth_form" action="#" method="post">
            <label class="auth_label" for="email">Email</label>
            <input class="auth_input" type="email" id="email" name="email">

            <label class="auth_label" for="password">Passwort</label>
            <input class="auth_input" type="password" id="password" name="password">

            <button class="auth_button" type="submit">Einloggen</button>
        </form>
    </section>
</section>

<!-- footer -->
<footer id="footer_box">
    <p id="footer_title">KONTAKT</p>

    <section id="footer_text">
        <p>Delivery Pizza</p>
        <p>Römerstr. 37</p>
        <p>93047 Regensburg</p>
    </section>
</footer>

<!-- scripts -->
<script src="/js/main.js"></script>
</body>
</html>
